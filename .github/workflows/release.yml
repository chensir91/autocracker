name: Release

# 打 tag 即发版：git tag v3.27 && git push origin v3.27
on:
  push:
    tags: [ 'v*' ]
  workflow_dispatch:
    inputs:
      version:
        description: '版本号，例如 3.27'
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 解析版本号
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ inputs.version }}"
          else
            VERSION="${GITHUB_REF_NAME#v}"
          fi
          CODE=$(echo "$VERSION" | awk -F. '{printf "%d%02d%02d", $1, $2, $3}')
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "code=$CODE" >> "$GITHUB_OUTPUT"
          echo "构建版本: $VERSION (versionCode=$CODE)"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: 解出签名密钥
        env:
          SIGNING_CONFIG: ${{ secrets.SIGNING_CONFIG }}
        run: |
          if [ -z "$SIGNING_CONFIG" ]; then
            echo "::error::仓库缺少 Secret：SIGNING_CONFIG，无法签名。请先配置。"
            exit 1
          fi
          python3 - <<'PY'
          import base64, json, os, pathlib
          cfg = json.loads(base64.b64decode(os.environ['SIGNING_CONFIG']).decode('utf-8'))
          ks = pathlib.Path('release.p12').resolve()
          ks.write_bytes(base64.b64decode(cfg['keystore']))
          with pathlib.Path(os.environ['GITHUB_ENV']).open('a') as f:
              f.write(f"KEYSTORE_PATH={ks}\n")
              f.write(f"KEYSTORE_PASSWORD={cfg['storePassword']}\n")
              f.write(f"KEY_ALIAS={cfg['keyAlias']}\n")
              f.write(f"KEY_PASSWORD={cfg['keyPassword']}\n")
          print(f"签名密钥已就绪: {ks} ({ks.stat().st_size} bytes)")
          PY

      - name: 构建 Release APK
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon \
            -PversionName=${{ steps.version.outputs.version }} \
            -PversionCode=${{ steps.version.outputs.code }}

      - name: 校验产物
        run: |
          ls -lh app/build/outputs/apk/release/
          APK=$(find app/build/outputs/apk/release -name '*.apk' | head -1)
          if [ -z "$APK" ]; then echo "::error::没有生成 APK"; exit 1; fi
          echo "APK_PATH=$APK" >> "$GITHUB_ENV"

      - name: 创建 GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v${{ steps.version.outputs.version }}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG 已存在，改为覆盖上传"
            gh release upload "$TAG" "$APK_PATH" --clobber
          else
            gh release create "$TAG" "$APK_PATH" \
              --title "v${{ steps.version.outputs.version }}" \
              --generate-notes \
              --target "${{ github.event_name == 'workflow_dispatch' && 'main' || github.ref_name }}"
          fi
