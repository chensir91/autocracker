name: Build

# 日常提交只做 debug 构建冒烟，确认能编译通过。
# 正式发版走 release.yml（打 tag 触发）。
on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin

      - name: 准备 Android SDK
        run: |
          echo "SDK 路径: ${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          SDK="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          # 运行器已预装 SDK，这里只补齐可能缺失的 platform 34
          if [ ! -d "$SDK/platforms/android-34" ]; then
            "$SDK/cmdline-tools/latest/bin/sdkmanager" --install "platforms;android-34" "build-tools;34.0.0" > /dev/null
          fi
          ls "$SDK/platforms"

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: 构建 Debug APK
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: autocracker-debug-${{ github.sha }}
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 14
